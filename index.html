<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <title>KMB Live ETA Dashboard</title>
  <style>
    /* Legacy-compatible CSS (No CSS Variables for E-Ink stability) */
    body {
      font-family: sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      display: inline-block;
    }

    .header-actions {
      float: right;
      font-size: 0.8rem;
    }

    .refresh-btn {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 2px 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .clear {
      clear: both;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 15px 0 8px 0;
      padding-left: 5px;
      border-left: 4px solid #000000;
    }

    .card {
      background-color: #ffffff;
      border: 2px solid #000000;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .route-header {
      border-bottom: 1px solid #ccc;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .route-number {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .destination {
      font-size: 0.9rem;
      float: right;
      margin-top: 5px;
    }

    .eta-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .eta-item {
      padding: 3px 0;
      border-bottom: 1px dashed #666666;
      font-size: 0.9rem;
    }

    .eta-time {
      font-weight: bold;
      float: right;
    }
  </style>
</head>
<body>

  <header>
    <h1>KMB ETA Dashboard</h1>
    <div class="header-actions">
      <span id="last-updated">Updating...</span>
      <button class="refresh-btn" onclick="updateDashboard()">刷新</button>
    </div>
    <div class="clear"></div>
  </header>

  <div id="dashboard-container"></div>

  <script>
    // Configuration
    var GROUPS = [
      {
        title: "形點出發",
        watchlist: [
          { route: "968X", stopId: "723EF8D7809D3ADB", serviceType: 1 },
          { route: "276P", stopId: "4E2EC89B41600D7E", serviceType: 1 },
          { route: "276",  stopId: "4E2EC89B41600D7E", serviceType: 1 },
          { route: "268C", stopId: "53AC50E46ABDA85B", serviceType: 1 }
        ]
      },
      {
        title: "鰂魚涌出發",
        watchlist: [
          { route: "968X", stopId: "F75D0D2C6014A854", serviceType: 1 }
        ]
      }
    ];

    // Legacy ES5 Fetch Wrapper (XMLHttpRequest for old WebKit)
    function fetchETA(stopId, route, serviceType, callback) {
      const url = "https://data.etabus.gov.hk/v1/transport/kmb/eta/" + stopId + "/" + route + "/" + serviceType;
      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var json = JSON.parse(xhr.responseText);
              callback(json.data || []);
            } catch (e) {
              callback([]);
            }
          } else {
            callback([]);
          }
        }
      };
      xhr.send();
    }

    function calculateMinutes(etaString) {
      if (!etaString) return "No data";
      var etaTime = new Date(etaString);
      var diffMs = etaTime.getTime() - new Date().getTime();
      var diffMins = Math.ceil(diffMs / 60000);
      return diffMins <= 0 ? "Arriving" : diffMins + " min";
    }

    function formatTime(etaString) {
      if (!etaString) return "--:--";
      var d = new Date(etaString);
      var hours = d.getHours();
      var minutes = d.getMinutes();
      if (hours < 10) hours = "0" + hours;
      if (minutes < 10) minutes = "0" + minutes;
      return hours + ":" + minutes;
    }

    function updateDashboard() {
      var container = document.getElementById("dashboard-container");
      container.innerHTML = "";

      for (var g = 0; g < GROUPS.length; g++) {
        (function(group) {
          var sectionHeader = document.createElement("div");
          sectionHeader.className = "section-title";
          sectionHeader.textContent = group.title;
          container.appendChild(sectionHeader);

          if (group.watchlist.length === 0) {
            var emptyCard = document.createElement("div");
            emptyCard.className = "card";
            emptyCard.innerHTML = '<div class="destination">No routes configured.</div>';
            container.appendChild(emptyCard);
          } else {
            for (var w = 0; w < group.watchlist.length; w++) {
              (function(target) {
                var card = document.createElement("div");
                card.className = "card";
                card.innerHTML = '<div class="route-header">' +
                  '<span class="route-number">' + target.route + '</span>' +
                  '<span class="destination" id="dest-' + target.route + '-' + target.stopId + '">往 Loading...</span>' +
                  '<div class="clear"></div>' +
                  '</div>' +
                  '<ul class="eta-list" id="list-' + target.route + '-' + target.stopId + '"><li class="eta-item">Loading...</li></ul>';
                
                container.appendChild(card);

                fetchETA(target.stopId, target.route, target.serviceType, function(etas) {
                  var destElem = document.getElementById("dest-" + target.route + "-" + target.stopId);
                  var listElem = document.getElementById("list-" + target.route + "-" + target.stopId);

                  var destName = (etas.length > 0 && etas[0].dest_tc) ? etas[0].dest_tc : "Unknown Destination";
                  if (destElem) destElem.textContent = "往 " + destName;

                  var etaRows = "";
                  if (etas.length === 0) {
                    etaRows = '<li class="eta-item">No upcoming departures</li>';
                  } else {
                    var limit = etas.length < 3 ? etas.length : 3;
                    for (var i = 0; i < limit; i++) {
                      var item = etas[i];
                      var minText = calculateMinutes(item.eta);
                      var timeFormatted = formatTime(item.eta);
                      var remark = item.rmk_tc ? " (" + item.rmk_tc + ")" : "";

                      etaRows += '<li class="eta-item">' +
                        '<span>' + timeFormatted + remark + '</span>' +
                        '<span class="eta-time">' + minText + '</span>' +
                        '<div class="clear"></div>' +
                        '</li>';
                    }
                  }
                  if (listElem) listElem.innerHTML = etaRows;
                });
              })(group.watchlist[w]);
            }
          }
        })(GROUPS[g]);
      }

      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();
      if (h < 10) h = "0" + h;
      if (m < 10) m = "0" + m;
      if (s < 10) s = "0" + s;
      document.getElementById("last-updated").textContent = h + ":" + m + ":" + s;
    }

    updateDashboard();
    setInterval(updateDashboard, 20000);
  </script>
</body>
</html>
